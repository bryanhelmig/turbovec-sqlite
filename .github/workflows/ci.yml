name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["sqlite-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONFAULTHANDLER: "1"
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.89.0"

jobs:
  quality:
    name: Rust, scripts, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install declared Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --all-targets --locked --no-deps -- -D warnings

      - name: Run Rust tests on the minimum supported toolchain
        run: |
          cargo test --all-targets --locked
          cargo test --doc --locked

      - name: Check current stable Rust compatibility
        run: cargo +stable check --all-targets --locked

      - name: Treat documentation warnings as errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

      - name: Check shell and Python sources
        run: |
          shellcheck scripts/*.sh
          python3 -m compileall -q benchmarks examples scripts tests

  sqlite-compatibility:
    name: SQLite 3.44 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install declared Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Build SQLite 3.44.0 from the official amalgamation
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLO \
            https://www.sqlite.org/2023/sqlite-amalgamation-3440000.zip
          unzip -q sqlite-amalgamation-3440000.zip
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          source = Path("sqlite-amalgamation-3440000/sqlite3.c").read_bytes()
          expected = "d9e6530096136067644b1cb2057b3b0fa51070df99ec61971f73c9ba6aa9a36e"
          assert hashlib.sha3_256(source).hexdigest() == expected
          PY
          cc -O2 \
            sqlite-amalgamation-3440000/shell.c \
            sqlite-amalgamation-3440000/sqlite3.c \
            -ldl -lpthread -o sqlite3-compat

      - name: Run smoke suite on supported baseline
        env:
          REQUIRE_PYTHON_TESTS: "1"
          SQLITE3: ${{ github.workspace }}/sqlite3-compat
        run: ./scripts/test.sh

  build-and-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
          - os: macos-14
            target: macos-aarch64
          - os: macos-15-intel
            target: macos-x86_64
          - os: windows-latest
            target: windows-x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os != 'macOS' && matrix.target != 'linux-aarch64'
        with:
          python-version: "3.13"

      - name: Install declared Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Install SQLite 3.44 (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLO \
            https://www.sqlite.org/2023/sqlite-amalgamation-3440000.zip
          unzip -q sqlite-amalgamation-3440000.zip
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          source = Path("sqlite-amalgamation-3440000/sqlite3.c").read_bytes()
          expected = "d9e6530096136067644b1cb2057b3b0fa51070df99ec61971f73c9ba6aa9a36e"
          assert hashlib.sha3_256(source).hexdigest() == expected
          PY
          cc -O2 \
            sqlite-amalgamation-3440000/shell.c \
            sqlite-amalgamation-3440000/sqlite3.c \
            -ldl -lpthread -o sqlite3-ci
          echo "SQLITE3=$GITHUB_WORKSPACE/sqlite3-ci" >> "$GITHUB_ENV"

      - name: Install SQLite and Python (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite
          brew install python@3.13 || \
            test -x "$(brew --prefix python@3.13)/bin/python3.13"
          echo "$(brew --prefix python@3.13)/libexec/bin" >> "$GITHUB_PATH"

      - name: Install SQLite (Windows)
        if: runner.os == 'Windows'
        run: choco install sqlite -y

      - name: Test extension
        shell: bash
        env:
          REQUIRE_PYTHON_TESTS: ${{ matrix.target != 'linux-aarch64' && '1' || '0' }}
          TRANSACTION_TEST_REPETITIONS: ${{ runner.os == 'Windows' && '5' || '1' }}
        run: ./scripts/test.sh

      - name: Run native Rust tests
        shell: bash
        run: cargo test --all-targets --locked

      - name: Test static linking
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/test_static.sh

      - name: Compare common contracts with sqlite-vec
        # The Ubuntu ARM runner's Python is linked to SQLite 3.37. Native ARM
        # coverage remains mandatory in the smoke, Rust, lint, and package steps.
        # sqlite-vec 0.1.9's Windows DLL intermittently access-violates when it
        # is repeatedly loaded; turbovec's Windows suite remains mandatory.
        if: matrix.target != 'linux-aarch64' && runner.os != 'Windows'
        shell: bash
        env:
          RAYON_NUM_THREADS: 1
        run: |
          ./scripts/compare_sqlite_vec.sh \
            --rows 512 \
            --dimensions 64 \
            --queries 12 \
            --k 10 \
            --repetitions 1 \
            --warmup 2

      - name: Lint extension
        shell: bash
        run: cargo clippy --all-targets --locked --no-deps -- -D warnings

      - name: Package extension
        shell: bash
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbovec-sqlite-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  client-examples:
    name: Python, JavaScript, and Go clients
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: examples/clients/go/go.sum

      - name: Install declared Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt --no-self-update

      - name: Check client sources
        run: |
          node --check examples/clients/javascript.mjs
          test -z "$(gofmt -l examples/clients/go)"
          (cd examples/clients/go && go test ./... && go vet ./...)

      - name: Run host-language examples
        run: ./scripts/test_clients.sh

  release:
    name: Publish tagged archives
    if: startsWith(github.ref, 'refs/tags/sqlite-v')
    needs: [quality, sqlite-compatibility, build-and-smoke, client-examples]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches crate version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "sqlite-v$version"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#sqlite-v}
          awk -v heading="## $version " '
            index($0, heading) == 1 { found=1 }
            found && /^## / && index($0, heading) != 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.tar.gz \
            release-assets/*.sha256 \
            --notes-file release-notes.md \
            --verify-tag \
            --title "turbovec-sqlite $GITHUB_REF_NAME"
